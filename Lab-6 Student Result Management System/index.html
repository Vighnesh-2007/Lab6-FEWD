
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <p class="tag">ACADEMIC MANAGEMENT PORTAL</p>
        <h1>Student Result System</h1>
        <p>Manage student marks and calculate academic results.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Enter Student Details</h2>

            <form id="resultForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName"
                               placeholder="Enter student name" required>
                    </div>

                    <div class="field">
                        <label for="rollNumber">Roll Number</label>
                        <input type="text" id="rollNumber"
                               placeholder="Enter roll number" required>
                    </div>

                    <div class="field">
                        <label for="subject1">Mathematics (100)</label>
                        <input type="number" id="subject1"
                               min="0" max="100" placeholder="0–100" required>
                    </div>

                    <div class="field">
                        <label for="subject2">Computer Science (100)</label>
                        <input type="number" id="subject2"
                               min="0" max="100" placeholder="0–100" required>
                    </div>

                    <div class="field full-width">
                        <label for="subject3">English (100)</label>
                        <input type="number" id="subject3"
                               min="0" max="100" placeholder="0–100" required>
                    </div>
                </div>

                <button type="submit">Calculate Result</button>
                <button type="reset" class="reset-btn">Clear Form</button>
            </form>
        </section>

        <section class="card result-card" id="resultSection" hidden>
            <p class="tag">STUDENT REPORT</p>
            <h2>Result Summary</h2>

            <div class="student-info">
                <p><strong>Name:</strong> <span id="outName"></span></p>
                <p><strong>Roll Number:</strong> <span id="outRoll"></span></p>
            </div>

            <div class="stats">
                <div><span>Total Marks</span><strong id="outTotal"></strong></div>
                <div><span>Percentage</span><strong id="outPercentage"></strong></div>
                <div><span>Grade</span><strong id="outGrade"></strong></div>
            </div>

            <p class="status" id="outStatus"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 Student Result Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
